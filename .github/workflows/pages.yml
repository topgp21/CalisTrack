name: CalisTrack · test and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['CalisTrack · prepare Google backend']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: calistrack-pages
  cancel-in-progress: true
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node --check public/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish HTTPS PWA
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed HTTPS app
        run: node scripts/check-site.mjs "$CALISTRACK_SITE_URL"
        env:
          CALISTRACK_SITE_URL: ${{ steps.deployment.outputs.page_url }}
